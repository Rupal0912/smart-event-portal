<html lang="en">
<head>

  <meta name="description" content="Smart Event Management Portal — Discover and book tickets for upcoming events." />
  <title>Smart Event Portal — Discover Events</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">⚡ Smart Events</a>
      <div class="navbar-links" id="navbar-links"></div>
