<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Smart Event Portal</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-brand">⚡ Smart Events</a>
            <div class="navbar-links" id="navbar-links"></div>
        </div>
    </nav>

    <main class="container">
        <div class="admin-header">
            <div>
                <h1 class="section-title">Admin Panel</h1>
                <p class="section-subtitle" style="margin-bottom:0">Manage events</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Add Event</button>
        </div>

        <div id="alert-container"></div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Price</th>
                        <th>Seats</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="events-tbody">
                    <tr>
                        <td colspan="6">
                            <div class="spinner"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal for Add/Edit Event -->
    <div id="event-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add Event</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="event-form">
                <input type="hidden" id="event-id" />
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Event title" required />
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Describe the event..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="date">Date & Time</label>
                    <input type="datetime-local" id="date" required />
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="City, Venue" required />
                </div>
                <div class="form-group">
                    <label for="capacity">Capacity</label>
                    <input type="number" id="capacity" min="1" placeholder="100" required />
                </div>
                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" min="0" value="0" required />
                </div>
                <div class="form-group">
                    <label for="image">Image URL (optional)</label>
                    <input type="url" id="image" placeholder="https://..." />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
