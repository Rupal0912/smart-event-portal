version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      # Pass MONGO_URI from host environment to the container
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
    # Optional: ensure MONGO_URI is set before starting
    # deploy:
    #   restart_policy:
    #     condition: on-failure

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
